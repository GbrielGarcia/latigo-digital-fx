name: Feature request / Propuesta de mejora
description: Suggest an idea. / Sugiere una idea.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation / Problema o motivación
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal / Propuesta
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / Alternativas consideradas
